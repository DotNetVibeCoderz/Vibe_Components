<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazor.AI · WebAssembly</title>
    <meta name="description" content="Blazor.AI components running fully in the browser. Dibuat oleh Gravicode Studios dipimpin oleh Kang Fadhil." />
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

                    <ellipse cx="32" cy="16" rx="7" ry="12" /><ellipse cx="32" cy="48" rx="7" ry="12" />

            </svg>

        </div>
    </div>
    <div id="blazor-error-ui" style="display:none">An error occurred. <a href="" class="reload">Reload</a></div>
    <script src="_framework/blazor.webassembly.js"></script>
