[package]
name = "osgnet_fast"
version = "0.1.0"
edition = "2021"
description = "Native hot paths for OpenSceneGraph.Net (normals, heightfields, batch culling, particles). Gravicode Studios."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
