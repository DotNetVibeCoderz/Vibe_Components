[package]
name = "agritech-native"
version = "1.0.0"
edition = "2021"
description = "High-performance native kernels for Agritech.Net (vegetation indices, raster statistics, FAO-56 ET0)."
license = "MIT"
authors = ["Gravicode Studios (Kang Fadhil)"]

[lib]
name = "agritech_native"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
