[package]
name = "geopandas_native"
version = "0.1.0"
edition = "2021"
description = "High-performance native kernels for GeoPandas.Net (Gravicode Studios)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
rayon = "1.10"
laz = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
