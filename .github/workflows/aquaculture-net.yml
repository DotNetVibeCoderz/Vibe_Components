name: AquaCulture.Net

# CI for every change under AquaCulture.Net/, and NuGet publishing when a tag like aquaculture-net-v1.0.0 is pushed
# (or when started manually with "publish" ticked). Uses the NUGET_API_KEY repository secret.
# The Rust kernels are built and tested for every runtime and packed into AquaCulture.Native.

on:
  push:
    branches: [main]
    paths: ["AquaCulture.Net/**", ".github/workflows/aquaculture-net.yml"]
    tags: ["aquaculture-net-v*"]
  pull_request:
    paths: ["AquaCulture.Net/**", ".github/workflows/aquaculture-net.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to NuGet"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aquaculture-net-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  kernels:
    name: Rust kernels (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    rid: win-x64,     file: aqua_native.dll }
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  rid: linux-x64,   file: libaqua_native.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, rid: linux-arm64, file: libaqua_native.so }
          - { os: macos-latest,     target: aarch64-apple-darwin,      rid: osx-arm64,   file: libaqua_native.dylib }
          - { os: macos-latest,     target: x86_64-apple-darwin,       rid: osx-x64,     file: libaqua_native.dylib }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: AquaCulture.Net/native/aqua-native
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: aquaculture-kernels-${{ matrix.rid }}
          path: AquaCulture.Net/native/aqua-native/target/${{ matrix.target }}/release/${{ matrix.file }}

  build:
    needs: kernels
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AquaCulture.Net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: aquaculture-kernels-*
          path: kernels

      - name: Place Rust kernels
        shell: pwsh
        run: |
          Get-ChildItem ../kernels -Directory | ForEach-Object {
            $rid = $_.Name.Substring('aquaculture-kernels-'.Length)
            $dst = "src/AquaCulture.Native/runtimes/$rid/native"
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$($_.FullName)/*" $dst -Force
            Write-Host "$rid -> $(Get-ChildItem $dst -Name)"
          }

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/aquaculture-net-v* ]]; then
            echo "args=-p:Version=${GITHUB_REF#refs/tags/aquaculture-net-v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore AquaCulture.Net.slnx

      - name: Build
        run: dotnet build AquaCulture.Net.slnx -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test
        run: dotnet test tests/AquaCulture.Tests/AquaCulture.Tests.csproj -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          for p in src/*/ tools/AquaCulture.Cli templates/AquaCulture.Templates; do
            dotnet pack "$p" -c Release --no-build -o artifacts ${{ steps.version.outputs.args }}
          done

      - uses: actions/upload-artifact@v4
        with:
          name: aquaculture-net-packages
          path: AquaCulture.Net/artifacts/*

  benchmarks:
    name: Performance budgets
    needs: kernels
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AquaCulture.Net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: aquaculture-kernels-win-x64
          path: AquaCulture.Net/src/AquaCulture.Native/runtimes/win-x64/native

      - name: Run benchmarks against budgets
        working-directory: AquaCulture.Net/benchmarks/AquaCulture.Benchmarks
        run: dotnet run -c Release -- --budgets budgets.json --job short --filter "*" --artifacts ${{ runner.temp }}/bench

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquaculture-net-benchmarks
          path: ${{ runner.temp }}/bench/results/*

  edge-aot:
    name: NativeAOT edge gateway (${{ matrix.rid }})
    needs: kernels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04-arm, rid: linux-arm64 }   # Raspberry Pi 4/5 (64-bit OS)
          - { os: ubuntu-22.04,     rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: AquaCulture.Net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - uses: actions/download-artifact@v4
        with:
          name: aquaculture-kernels-${{ matrix.rid }}
          path: AquaCulture.Net/src/AquaCulture.Native/runtimes/${{ matrix.rid }}/native

      - name: Publish (NativeAOT, trim/AOT warnings are errors)
        run: dotnet publish samples/AquaCulture.EdgeGateway -c Release -r ${{ matrix.rid }} -o out/aqua-edge-${{ matrix.rid }}

      - name: Self-test the native binary
        run: |
          ls -l out/aqua-edge-${{ matrix.rid }}/aqua-edge
          out/aqua-edge-${{ matrix.rid }}/aqua-edge --selftest --require-native

      - uses: actions/upload-artifact@v4
        with:
          name: aqua-edge-${{ matrix.rid }}
          path: |
            AquaCulture.Net/out/aqua-edge-${{ matrix.rid }}/aqua-edge
            AquaCulture.Net/out/aqua-edge-${{ matrix.rid }}/runtimes/**

  field-app:
    name: MAUI field app (Android, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AquaCulture.Net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - name: MAUI workloads
        run: dotnet workload install maui-android maui-windows

      - name: Build Windows
        run: dotnet build samples/AquaCulture.FieldApp -f net10.0-windows10.0.19041.0 -c Release

      - name: Publish Android APK
        run: dotnet publish samples/AquaCulture.FieldApp -f net10.0-android -c Release -p:AndroidPackageFormats=apk -o out/field-android

      - uses: actions/upload-artifact@v4
        with:
          name: aquaculture-field-android
          path: AquaCulture.Net/out/field-android/*-Signed.apk

  publish:
    needs: [build, benchmarks, edge-aot]
    if: startsWith(github.ref, 'refs/tags/aquaculture-net-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aquaculture-net-packages
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet
        working-directory: packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
