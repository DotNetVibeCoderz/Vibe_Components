name: GeoPandas.Net

# CI for every change under GeoPandas.Net/, and NuGet publishing + GitHub release when a tag like
# geopandas-net-v0.1.0 is pushed (or when started manually with "publish" ticked). Uses the NUGET_API_KEY repository secret.
# The Rust kernels are built for every runtime and packed into GeoPandas.Net.Geometry (runtimes/<rid>/native).

on:
  push:
    branches: [main]
    paths: ["GeoPandas.Net/**", ".github/workflows/geopandas-net.yml"]
    tags: ["geopandas-net-v*"]
  pull_request:
    paths: ["GeoPandas.Net/**", ".github/workflows/geopandas-net.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to NuGet"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: geopandas-net-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  kernels:
    name: Rust kernels (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    rid: win-x64,     file: geopandas_native.dll }
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  rid: linux-x64,   file: libgeopandas_native.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, rid: linux-arm64, file: libgeopandas_native.so }
          - { os: macos-latest,     target: aarch64-apple-darwin,      rid: osx-arm64,   file: libgeopandas_native.dylib }
          - { os: macos-latest,     target: x86_64-apple-darwin,       rid: osx-x64,     file: libgeopandas_native.dylib }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: GeoPandas.Net/native/geopandas_native
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: geopandas-kernels-${{ matrix.rid }}
          path: GeoPandas.Net/native/geopandas_native/target/${{ matrix.target }}/release/${{ matrix.file }}

  build:
    needs: kernels
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GeoPandas.Net
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: GeoPandas.Net/global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: geopandas-kernels-*
          path: kernels

      - name: Place Rust kernels
        shell: pwsh
        run: |
          Get-ChildItem ../kernels -Directory | ForEach-Object {
            $rid = $_.Name.Substring('geopandas-kernels-'.Length)
            $dst = "src/GeoPandas.Net.Geometry/runtimes/$rid/native"
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$($_.FullName)/*" $dst -Force
            Write-Host "$rid -> $(Get-ChildItem $dst -Name)"
          }

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/geopandas-net-v* ]]; then
            echo "args=-p:Version=${GITHUB_REF#refs/tags/geopandas-net-v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore GeoPandas.Net.slnx

      - name: Build
        run: dotnet build GeoPandas.Net.slnx -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test (Rust kernels)
        run: dotnet test tests/GeoPandas.Net.Tests/GeoPandas.Net.Tests.csproj -c Release --no-build

      - name: Test (managed SIMD fallback)
        env:
          GEOPANDAS_NET_DISABLE_NATIVE: "1"
        run: dotnet test tests/GeoPandas.Net.Tests/GeoPandas.Net.Tests.csproj -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          for p in src/*/ tools/GeoPandas.Net.Cli templates/GeoPandas.Net.Templates; do
            dotnet pack "$p" -c Release --no-build -o artifacts ${{ steps.version.outputs.args }}
          done

      - uses: actions/upload-artifact@v7
        with:
          name: geopandas-net-packages
          path: GeoPandas.Net/artifacts/*

  sql-services:
    name: SQL integration (PostGIS, Oracle)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: gpd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      oracle:
        image: gvenzl/oracle-free:23-faststart   # full image: the slim variant has no Oracle Spatial (SDO_GEOMETRY)
        env:
          ORACLE_PASSWORD: gpd
          APP_USER: gpd
          APP_USER_PASSWORD: gpd
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 60
    defaults:
      run:
        working-directory: GeoPandas.Net
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: GeoPandas.Net/global.json

      - name: Live SQL tests
        env:
          GPD_POSTGIS_CS: "Host=localhost;Username=postgres;Password=gpd;Database=postgres"
          GPD_ORACLE_CS: "User Id=gpd;Password=gpd;Data Source=localhost:1521/FREEPDB1"
          GEOPANDAS_NET_DISABLE_NATIVE: "1"
        run: dotnet test tests/GeoPandas.Net.Tests/GeoPandas.Net.Tests.csproj -c Release --filter "FullyQualifiedName~SqlTests" --logger "console;verbosity=detailed"

  publish:
    needs: [build, sql-services]
    if: startsWith(github.ref, 'refs/tags/geopandas-net-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: geopandas-net-packages
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet
        working-directory: packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/geopandas-net-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$TAG" packages/*.nupkg --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$TAG" packages/*.nupkg --repo "$GITHUB_REPOSITORY" --title "GeoPandas.Net ${TAG#geopandas-net-v}" \
                 --notes "GeoPandas.Net ${TAG#geopandas-net-v} — see GeoPandas.Net/Progress.md. Dibuat oleh Gravicode Studios dipimpin oleh Kang Fadhil."
