name: Medical.Net

# CI for every change under Medical.Net/, and NuGet publishing when a tag like medical-net-v1.0.0 is pushed
# (or when started manually with "publish" ticked). Uses the NUGET_API_KEY repository secret.
# The Rust kernels are built for every runtime and packed into Medical.Native.

on:
  push:
    branches: [main]
    paths: ["Medical.Net/**", ".github/workflows/medical-net.yml"]
    tags: ["medical-net-v*"]
  pull_request:
    paths: ["Medical.Net/**", ".github/workflows/medical-net.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to NuGet"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: medical-net-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  kernels:
    name: Rust kernels (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    rid: win-x64,     file: medical_native.dll }
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  rid: linux-x64,   file: libmedical_native.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, rid: linux-arm64, file: libmedical_native.so }
          - { os: macos-latest,     target: aarch64-apple-darwin,      rid: osx-arm64,   file: libmedical_native.dylib }
          - { os: macos-latest,     target: x86_64-apple-darwin,       rid: osx-x64,     file: libmedical_native.dylib }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Medical.Net/native/medical-native
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: medical-kernels-${{ matrix.rid }}
          path: Medical.Net/native/medical-native/target/${{ matrix.target }}/release/${{ matrix.file }}

  imaging-service:
    name: Imaging AI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Medical.Net/services/medical-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and smoke-test
        run: |
          pip install -r requirements.txt
          python -c "from fastapi.testclient import TestClient; import app; r = TestClient(app.app).get('/health'); assert r.status_code == 200, r.text; print(r.json())"

  build:
    needs: kernels
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Medical.Net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: medical-kernels-*
          path: kernels

      - name: Place Rust kernels
        shell: pwsh
        run: |
          Get-ChildItem ../kernels -Directory | ForEach-Object {
            $rid = $_.Name.Substring('medical-kernels-'.Length)
            $dst = "src/Medical.Native/runtimes/$rid/native"
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$($_.FullName)/*" $dst -Force
            Write-Host "$rid -> $(Get-ChildItem $dst -Name)"
          }

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/medical-net-v* ]]; then
            # VersionPrefix (not Version) so packages with their own VersionSuffix (Medical.Devices: preview) stay prerelease
            echo "args=-p:VersionPrefix=${GITHUB_REF#refs/tags/medical-net-v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore Medical.Net.slnx

      - name: Build
        run: dotnet build Medical.Net.slnx -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test
        run: dotnet test tests/Medical.Tests/Medical.Tests.csproj -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          for p in src/*/ tools/Medical.Cli templates/Medical.Templates; do
            dotnet pack "$p" -c Release --no-build -o artifacts ${{ steps.version.outputs.args }}
          done

      - uses: actions/upload-artifact@v4
        with:
          name: medical-net-packages
          path: Medical.Net/artifacts/*

  publish:
    needs: [build, imaging-service]
    if: startsWith(github.ref, 'refs/tags/medical-net-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medical-net-packages
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet
        working-directory: packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
