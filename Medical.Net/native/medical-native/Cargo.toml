[package]
name = "medical-native"
version = "1.0.0"
edition = "2021"
description = "High-performance native kernels for Medical.Net (DICOM VOI window/level, pixel statistics, ECG QRS detection)."
license = "MIT"
authors = ["Gravicode Studios (Kang Fadhil)"]

[lib]
name = "medical_native"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
